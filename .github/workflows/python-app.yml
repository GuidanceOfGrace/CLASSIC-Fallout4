# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            allow-test-failures: true # TODO: Make tests multiplatform
          - os: windows-latest
            allow-test-failures: true # TODO: Fix tests
    steps:

    - name: Check out sources
      uses: actions/checkout@v4

    # We cant use the poetry cache here because the poetry lock isnt checked-in.
    # TODO: Check poetry lock into git.
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version-file: 'pyproject.toml'

    # Pip doesn't really need upgrading, but doing so avoids annoying warnings. 
    - name: Install development tooling
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    # Executed as a separate step to make debugging build failures easier.
    - name: Install project dependencies
      run: |
        poetry install --no-root

    - name: Code linting
      run: |
        poetry run ruff check

    - name: Automated tests
      continue-on-error: ${{ matrix.allow-test-failures }}
      run: |
        poetry run pytest

    # Installing upx here in case the build fails earlier.
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: latest
        install-only: true

    # UPX _should_ be found on the PATH after the previous install step.
    - name: Package installer
      run: |
        poetry run pyinstaller --clean ./CLASSIC.spec

    - name: Archive build results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-dist
        path: dist

    # TODO: Github release on tag.